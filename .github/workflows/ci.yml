name: VibeGuard Cloud CI

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Offline Unit & Split Verification (Python 3.11 CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run offline unit and split-disjointness tests
        run: |
          python -m pytest -q
