name: VibeGuard Cloud CI

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Offline Unit & Split Verification (Python 3.11 CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -c "import numpy, pyarrow, pandas, streamlit, torch; assert numpy.__version__ == '1.26.4'; assert pyarrow.__version__ == '1.8.0' or pyarrow.__version__ == '18.1.0'; assert '+cpu' in torch.__version__; print('Verified Linux Python 3.11 env:', {'numpy': numpy.__version__, 'pyarrow': pyarrow.__version__, 'torch': torch.__version__, 'streamlit': streamlit.__version__})"

      - name: Run offline unit and split-disjointness tests
        run: |
          python -m pytest -q
          python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('app.py', default_timeout=30); at.run(); assert len(at.exception) == 0, at.exception; print('Clean Linux Python 3.11 AppTest verified: 0 exceptions')"
